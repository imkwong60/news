<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#14202b; --mute:#5d6b78; --line:#d9e0e6;
  --hk:#c8312b; --tech:#1f6feb; --esp:#d9480f; --evt:#0b7a75; --ent:#c2255c; --game:#7a4de0; --prop:#8b5a2b;
  --bar:#0f1a24; --bar-ink:#f2f5f8;
  --wx:#1a6b8a;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b141c; --surface:#142230; --ink:#e8eef3; --mute:#92a1ae; --line:#233445;
         --hk:#ff6b62; --tech:#6aa6ff; --esp:#ff9a57; --evt:#4fd1c5; --ent:#ff8fb1; --game:#b79bff; --prop:#d4a574;
         --wx:#5eb8d8; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 "PingFang HK","Noto Sans HK","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;

header{background:var(--bar);color:var(--bar-ink);

h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.04em}

.wx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}

const LABELS = { hk: '香港', tech: '科技', esports: '電競', game: '遊戲', events: '活動', ent: '影視娛樂', prop: '樓市' };

const $ = (s) => document.querySelector(s);
const btn = $('#sub-btn'), notice = $('#notice'), list = $('#list'), wxEl = $('#wx');
let filter = 'all', digests = [];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const b64ToU8 = (b) => {
  const p = '='.repeat((4 - (b.length % 4)) % 4);
  const r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...r].map((c) => c.charCodeAt(0)));
};
const say = (t) => { notice.textContent = t; notice.classList.toggle('show', !!t); };

/* ---------- 天氣（沙田） ---------- */
const ICON_DESC = {
  50:'陽光充沛',51:'間有陽光',52:'短暫陽光',53:'間有陽光幾陣驟雨',54:'短暫陽光有驟雨',
  60:'多雲',61:'密雲',62:'微雨',63:'雨',64:'大雨',65:'雷暴',
  70:'天色良好',71:'天色良好',72:'天色良好',73:'天色良好',74:'天色良好',75:'天色良好',76:'大致多雲',77:'天色大致良好',
  80:'大風',81:'乾燥',82:'潮濕',83:'霧',84:'薄霧',85:'煙霞',
  90:'熱',91:'暖',92:'涼',93:'冷'
};
const AQHI_LABEL = { Low:'低', Moderate:'中等', High:'高', 'Very High':'甚高', Serious:'嚴重' };

function pickPlace(arr, names) {
  if (!arr) return null;
  for (const n of names) {
    const hit = arr.find((x) => x.place === n || x.place?.includes(n));
    if (hit) return hit;
  }
  return arr[0] || null;
}

async function loadWeather() {
  try {
    const [rhr, flw, aqhi, warn] = await Promise.all([
      fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc').then((r) => r.json()),
      fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc').then((r) => r.json()),
      fetch('https://dashboard.data.gov.hk/api/aqhi-individual?format=json').then((r) => r.json()).catch(() => []),
      fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc').then((r) => r.json()).catch(() => ({})),
    ]);

    const temp = pickPlace(rhr.temperature?.data, ['沙田']);
    const rain = pickPlace(rhr.rainfall?.data, ['沙田']);
    const humid = rhr.humidity?.data?.[0];
    const uv = rhr.uvindex?.data?.[0];
    const iconCode = Array.isArray(rhr.icon) ? rhr.icon[0] : rhr.icon;
    const iconUrl = iconCode ? `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png` : '';
    const desc = ICON_DESC[iconCode] || '';

    const aq = (Array.isArray(aqhi) ? aqhi : []).find((s) => s.station === 'Sha Tin' || s.station === '沙田');
    const aqVal = aq?.aqhi ?? '—';
    const aqRisk = AQHI_LABEL[aq?.health_risk] || aq?.health_risk || '';

    // 警告摘要
    const warnKeys = Object.keys(warn || {}).filter((k) => warn[k] && typeof warn[k] === 'object');
    const warnText = warnKeys.length
      ? warnKeys.map((k) => warn[k].name || warn[k].type || k).join('、')
      : (rhr.warningMessage || '');

    const forecast = flw.forecastDesc || '';
    const outlook = flw.outlook || '';
    const update = rhr.updateTime
      ? new Date(rhr.updateTime).toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong', hour: '2-digit', minute: '2-digit', hour12: false })
      : '';

    wxEl.innerHTML = `
      <div class="wx-head">
        ${iconUrl ? `<img class="wx-icon" src="${esc(iconUrl)}" alt="${esc(desc)}" width="48" height="48">` : ''}
        <div class="wx-main">
          <div class="wx-place">沙田 · 香港天文台</div>
          <div class="wx-temp">${temp ? temp.value + '°C' : '—'}</div>
          <div class="wx-desc">${esc(desc)}${update ? ' · 更新 ' + update : ''}</div>
        </div>
      </div>
      <div class="wx-grid">
        <div class="wx-cell"><div class="k">濕度</div><div class="v">${humid ? humid.value + '%' : '—'}</div></div>
        <div class="wx-cell"><div class="k">紫外線</div><div class="v">${uv ? uv.value + (uv.desc ? ' ' + uv.desc : '') : '—'}</div></div>
        <div class="wx-cell"><div class="k">降雨</div><div class="v">${rain && rain.max != null ? rain.max + ' mm' : '0 mm'}</div></div>
        <div class="wx-cell"><div class="k">AQHI</div><div class="v">${aqVal}${aqRisk ? ' ' + aqRisk : ''}</div></div>
      </div>
      ${warnText ? `<div class="wx-warn">⚠️ ${esc(warnText)}</div>` : ''}
      ${(forecast || outlook) ? `<div class="wx-forecast">${esc(forecast)}${outlook ? '<br>' + esc(outlook) : ''}</div>` : ''}
      <div class="wx-source">資料來源：香港天文台 Open Data · 環保署 AQHI</div>
    `;
  } catch (e) {
    wxEl.innerHTML = '<div class="wx-loading">天氣暫時未能載入</div>';
    console.error('weather', e);
  }
}

/* ---------- 新聞列表 ---------- */
function ago(ts) {
  if (!ts) return '';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 60) return Math.max(m, 1) + ' 分鐘前';
  if (m < 1440) return Math.round(m / 60) + ' 小時前';
  return new Date(ts).toLocaleDateString('zh-HK');
}
const articleCache = new Map(); // link -> text
const inflight = new Map();     // link -> Promise

const BLOCK_RE = /(just a moment|enable javascript|access denied|attention required|captcha|verify you are (a )?human|請啟用\s*javascript|403 forbidden|target url returned error)/i;

// Google News 舊式連結內含原文網址，可直接解出
function unwrapGoogleNews(url) {
  try {
    const u = new URL(url);
    if (u.hostname !== 'news.google.com') return url;
    const id = u.pathname.split('/').pop();
    const bin = atob(id.replace(/-/g, '+').replace(/_/g, '/'));
    const m = bin.match(/https?:\/\/[\x21-\x7e]+/);
    if (m) return m[0];
  } catch (_) {}
  return url;
}

function paras(el) {
  const t = [...el.querySelectorAll('p,h2,h3')]
    .map((p) => p.textContent.replace(/\s+/g, ' ').trim())
    .filter((x) => x.length >= 20).join('\n\n');
  if (t.length >= 200) return t;
  return (el.textContent || '').replace(/[ \t\u00a0]+/g, ' ').replace(/\n\s*\n+/g, '\n\n').trim();
}

function extractFromHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const meta = (n) => (doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`)?.content || '').trim();
  const desc = meta('og:description') || meta('description');
  doc.querySelectorAll('script,style,nav,header,footer,aside,iframe,noscript,form,figure,[class*="related"],[class*="share"],[class*="comment"],[class*="advert"]').forEach((n) => n.remove());
  const sels = ['article', '[itemprop="articleBody"]',
    '.article-content,.article-body,.story-body,.post-content,.entry-content,#article-body,.content-article', 'main'];
  let best = '';
  for (const sel of sels) {
    const el = doc.querySelector(sel);
    if (!el) continue;
    const t = paras(el);
    if (t.length > best.length) best = t;
    if (best.length > 400) break;
  }
  if (best.length < 200 && doc.body) best = paras(doc.body);
  return best.length >= 200 ? best : (desc.length > best.length ? desc : best);
}

function cleanJina(t) {
  return t.replace(/^Title:.*\n/m, '').replace(/^URL Source:.*\n/m, '')
    .replace(/^Published Time:.*\n/m, '').replace(/^Markdown Content:\n?/m, '')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')            // 圖片
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')          // 連結只留文字
    .replace(/^#{1,3} .+\n+/, '').replace(/\n{3,}/g, '\n\n').trim();
}

const PROXIES = [
  (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  (u) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
];

function fetchArticleText(rawUrl) {
  if (articleCache.has(rawUrl)) return Promise.resolve(articleCache.get(rawUrl));
  if (inflight.has(rawUrl)) return inflight.get(rawUrl);
  const p = (async () => {
    const url = unwrapGoogleNews(rawUrl);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    let fallback = '';
    const accept = (t) => {
      t = (t || '').trim();
      if (BLOCK_RE.test(t.slice(0, 300))) throw new Error('blocked');
      if (t.length >= 200) return t;
      if (t.length >= 60 && t.length > fallback.length) fallback = t;
      throw new Error('short');
    };
    const jobs = [
      // Jina Reader
      async () => {
        const r = await fetch('https://r.jina.ai/' + url, { headers: { Accept: 'text/plain' }, signal: ctl.signal });
        if (!r.ok) throw new Error(String(r.status));
        return accept(cleanJina(await r.text()));
      },
      // 其他 CORS 代理 + 自行抽取（同時競速，取最快成功者）
      ...PROXIES.map((px) => async () => {
        const r = await fetch(px(url), { signal: ctl.signal });
        if (!r.ok) throw new Error(String(r.status));
        const html = await r.text();
        if (!/<(html|body|p|article)[\s>]/i.test(html)) throw new Error('not html');
        return accept(extractFromHtml(html));
      }),
    ];
    try {
      const text = await Promise.any(jobs.map((j) => j()));
      articleCache.set(rawUrl, text);
      return text;
    } catch (_) {
      return fallback || null;   // 全部失敗：最多回傳網頁摘要，不快取失敗結果
    } finally {
      clearTimeout(timer);
      ctl.abort();               // 取消仍在進行的其餘請求
      inflight.delete(rawUrl);
    }
  })();
  inflight.set(rawUrl, p);
  return p;
}

async function loadBody(li, force) {
  const link = li.dataset.link;
  const body = li.querySelector('.art-body');
  if (body.dataset.loaded === '1' && !force) return;
  body.className = 'art-body loading';
  body.textContent = '正在擷取全文…（最多約 20 秒）';
  const text = await fetchArticleText(link);
  body.className = 'art-body';
  body.textContent = '';
  const orig = (label) => {
    const oa = document.createElement('a');
    oa.className = 'orig';
    oa.href = link; oa.target = '_blank'; oa.rel = 'noopener';
    oa.textContent = label;
    return oa;
  };
  if (text) {
    body.textContent = text.length > 6000 ? text.slice(0, 6000) + '…' : text;
    body.appendChild(document.createElement('br'));
    body.appendChild(orig('閱讀原文 ↗'));
    body.dataset.loaded = '1';
  } else {
    const sp = document.createElement('span');
    sp.className = 'err';
    sp.textContent = '暫時無法擷取全文（網站可能有保護，或代理服務繁忙）。';
    const rt = document.createElement('a');
    rt.className = 'orig';
    rt.href = 'javascript:void(0)';
    rt.style.marginRight = '16px';
    rt.textContent = '重試 ↻';
    rt.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); loadBody(li, true); });
    body.append(sp, document.createElement('br'), rt, orig('開啟原文 ↗'));
    delete body.dataset.loaded;   // 失敗不標記為已載入，可再試
  }
}

function render() {
  if (!digests.length) { list.innerHTML = '<p class="empty">暫時未有新聞摘要。<br>下一個推送時間：9:00、15:00、21:00。</p>'; return; }
  list.innerHTML = digests.map((d) => {
    const t = new Date(d.created_at);
    const when = t.toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
    const cats = Object.keys(LABELS).filter((k) => (filter === 'all' || filter === k) && (d.items[k] || []).length)
      .map((k) => `<section class="cat" data-k="${k}"><h2>${LABELS[k]}</h2><ul>` +
        d.items[k].map((i) =>
          `<li data-link="${esc(i.link)}">` +
          `<a class="t" href="javascript:void(0)" role="button">${esc(i.title)}</a>` +
          `<small>${i.tag ? `<span class="tag">${esc(i.tag)}</span>` : ''}${esc(i.source || '')} ${ago(i.ts)}</small>` +
          `<div class="art-body"></div>` +
          `</li>`
        ).join('') +
        '</ul></section>').join('');
    return cats ? `<article class="digest"><h3 class="digest-title"><strong>${esc(d.slot)}</strong>${when}</h3>${cats}</article>` : '';
  }).join('') || '<p class="empty">這個分類暫時沒有新聞。</p>';

  list.querySelectorAll('li[data-link] > a.t').forEach((a) => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const li = a.closest('li');
      if (li.classList.contains('expanded')) { li.classList.remove('expanded'); return; }
      list.querySelectorAll('li.expanded').forEach((x) => x.classList.remove('expanded'));
      li.classList.add('expanded');
      loadBody(li, false);
    });
  });
}
async function load() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/digests?select=slot,items,created_at&order=created_at.desc&limit=9`,
      { headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON } });
    if (!r.ok) throw new Error(r.status);
    digests = await r.json();
    render();
  } catch (e) {
    list.innerHTML = '<p class="empty">載入失敗，請檢查網絡後重新整理。</p>';
  }
}
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('nav button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  render();
}));

/* ---------- 推送訂閱 ---------- */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;

async function saveSub(sub) {
  const j = sub.toJSON();
  const r = await fetch(`${SUPABASE_URL}/rest/v1/subscriptions`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON,
      'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }),
  });
  if (r.status === 409) return;            // 已訂閱過，當作成功
  if (!r.ok) throw new Error('儲存失敗 ' + r.status + ' ' + (await r.text()).slice(0, 200));
}
function setBtn(on, label, disabled) {
  btn.dataset.on = on; btn.textContent = label; btn.disabled = !!disabled;
}
async function initPush() {
  btn.disabled = false;                       // 先確保掣可以撳，問題會在畫面上說明
  if (!('serviceWorker' in navigator)) { say('此瀏覽器不支援 Service Worker，無法使用推送。'); return; }
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  if (isIOS && !standalone) {
    say('iPhone／iPad：請先按 Safari 的「分享」→「加入主畫面」，再由主畫面開啟此 App，才可開啟推送。');
    setBtn(false, '開啟推送', false); return;
  }
  if (!('PushManager' in window)) { say('此環境不支援推送（iPhone 需 iOS 16.4 或以上，並由主畫面開啟）。'); setBtn(false, '開啟推送', false); return; }
  const sub = await reg.pushManager.getSubscription();
  if (sub && Notification.permission === 'granted') { saveSub(sub).catch(() => {}); setBtn(true, '推送已開啟', false); }
  else setBtn(false, '開啟推送', false);
  if (Notification.permission === 'denied') { say('通知已被封鎖，請到系統「設定」→「通知」允許此 App。'); }
}
btn.addEventListener('click', async () => {
  if (isIOS && !standalone) { say('請先「加入主畫面」，再由主畫面圖示開啟此 App，然後撳開啟推送。'); return; }
  if (!('PushManager' in window)) { say('此環境不支援推送。'); return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (btn.dataset.on === 'true') {            // 關閉推送
    if (sub) await sub.unsubscribe();
    setBtn(false, '開啟推送', false); say('已關閉推送。'); return;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { say('未允許通知，無法開啟推送。'); return; }
    const s = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC) });
    await saveSub(s);
    setBtn(true, '推送已開啟', false); say('已開啟！每日 9:00、15:00、21:00 會收到新聞摘要。');
  } catch (e) { say('開啟失敗：' + e.message); }
});

navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', (e) => e.data.type === 'refresh' && load());
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { load(); loadWeather(); }
});
load();
loadWeather();
initPush().catch((e) => say('初始化失敗：' + e.message));
// 每 15 分鐘自動刷新天氣
setInterval(loadWeather, 15 * 60 * 1000);
</script>
