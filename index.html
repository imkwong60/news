<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新聞本本</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="新聞本本">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon192.png">
<link rel="icon" href="icon192.png">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#14202b; --mute:#5d6b78; --line:#d9e0e6;
  --hk:#c8312b; --tech:#1f6feb; --esp:#d9480f; --evt:#0b7a75; --ent:#c2255c; --game:#7a4de0; --prop:#8b5a2b;
  --bar:#0f1a24; --bar-ink:#f2f5f8;
  --wx:#1a6b8a;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b141c; --surface:#142230; --ink:#e8eef3; --mute:#92a1ae; --line:#233445;
         --hk:#ff6b62; --tech:#6aa6ff; --esp:#ff9a57; --evt:#4fd1c5; --ent:#ff8fb1; --game:#b79bff; --prop:#d4a574;
         --wx:#5eb8d8; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 "PingFang HK","Noto Sans HK","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--bar);color:var(--bar-ink);
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:5}
.head-row{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.04em}
#sub-btn{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:999px;padding:8px 16px;
  background:#f2f5f8;color:#0f1a24;cursor:pointer}
#sub-btn[data-on="true"]{background:transparent;color:#9fe3b0;box-shadow:inset 0 0 0 1px #9fe3b066}
#sub-btn:disabled{opacity:.5;cursor:default}
nav{max-width:680px;margin:12px auto 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-size:14px;border:1px solid #ffffff33;background:transparent;color:var(--bar-ink);
  border-radius:999px;padding:4px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink)}
button:focus-visible{outline:2px solid #6aa6ff;outline-offset:2px}
main{max-width:680px;margin:0 auto;padding:18px 16px 48px}
#notice{display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:16px;font-size:14px;color:var(--mute)}
#notice.show{display:block}

/* 天氣卡 */
.wx-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;
  border-left:4px solid var(--wx);overflow:hidden}
.wx-head{display:flex;align-items:center;gap:12px;padding:12px 14px 8px}
.wx-icon{width:48px;height:48px;flex-shrink:0}
.wx-main{flex:1;min-width:0}
.wx-place{font-size:13px;color:var(--mute);font-weight:600}
.wx-temp{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.wx-desc{font-size:13px;color:var(--mute);margin-top:2px}
.wx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}
.wx-cell{padding:10px 6px;text-align:center;border-right:1px solid var(--line)}
.wx-cell:last-child{border-right:0}
.wx-cell .k{font-size:11px;color:var(--mute);font-weight:600}
.wx-cell .v{font-size:15px;font-weight:700;margin-top:2px}
.wx-warn{padding:8px 14px;background:color-mix(in srgb,var(--hk) 12%,transparent);
  border-top:1px solid var(--line);font-size:13px;color:var(--hk);font-weight:600}
.wx-forecast{padding:8px 14px 12px;font-size:13px;color:var(--mute);line-height:1.45;border-top:1px solid var(--line)}
.wx-source{font-size:11px;color:var(--mute);padding:0 14px 10px;opacity:.75}
.wx-loading{padding:20px;text-align:center;color:var(--mute);font-size:14px}

.digest{margin-bottom:28px}
.digest-title{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;font-size:15px;color:var(--mute);font-weight:600}
.digest-title strong{font-size:18px;color:var(--ink)}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;
  border-left:4px solid var(--c);overflow:hidden}
.cat[data-k="hk"]{--c:var(--hk)} .cat[data-k="tech"]{--c:var(--tech)} .cat[data-k="esports"]{--c:var(--esp)} .cat[data-k="game"]{--c:var(--game)} .cat[data-k="events"]{--c:var(--evt)} .cat[data-k="ent"]{--c:var(--ent)} .cat[data-k="prop"]{--c:var(--prop)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:4px;padding:0 5px;margin-right:6px;line-height:1.5}
.cat h2{margin:0;padding:10px 14px 4px;font-size:14px;font-weight:700;color:var(--c)}
.cat ul{list-style:none;margin:0;padding:0 14px 6px}
.cat li{padding:9px 0;border-top:1px solid var(--line)}
.cat li:first-child{border-top:0}
.cat a{color:var(--ink);text-decoration:none;font-weight:600;line-height:1.45;display:block}
.cat a:active,.cat a:hover{text-decoration:underline}
.cat small{color:var(--mute);font-size:12.5px}
.cat li.expanded{background:color-mix(in srgb,var(--c) 6%,transparent)}
.cat a.t{cursor:pointer;user-select:none}
.cat a.t::after{content:' ▾';font-size:11px;opacity:.45;font-weight:400}
.cat li.expanded a.t::after{content:' ▴'}
.art-body{display:none;padding:8px 0 4px;font-size:14px;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.cat li.expanded .art-body{display:block}
.art-body.loading{color:var(--mute);font-style:italic}
.art-body .err{color:var(--mute)}
.art-body .orig{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--c)}
.empty{text-align:center;color:var(--mute);padding:56px 12px}
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>新聞本本</h1>
    <button id="sub-btn" type="button" disabled>開啟推送</button>
  </div>
  <nav aria-label="分類">
    <button type="button" data-f="all" aria-pressed="true">全部</button>
    <button type="button" data-f="hk" aria-pressed="false">香港</button>
    <button type="button" data-f="tech" aria-pressed="false">科技</button>
    <button type="button" data-f="esports" aria-pressed="false">電競</button>
    <button type="button" data-f="game" aria-pressed="false">遊戲</button>
    <button type="button" data-f="events" aria-pressed="false">活動</button>
    <button type="button" data-f="ent" aria-pressed="false">影視娛樂</button>
    <button type="button" data-f="prop" aria-pressed="false">樓市</button>
  </nav>
</header>
<main>
  <div id="wx" class="wx-card"><div class="wx-loading">天氣載入中…</div></div>
  <div id="notice"></div>
  <div id="list"><p class="empty">載入中…</p></div>
</main>

<script>
const SUPABASE_URL = 'https://wemwppzjiiiygxfwbxev.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlbXdwcHpqaWlpeWd4ZndieGV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MjcwODYsImV4cCI6MjEwMjMwMzA4Nn0.SRO5VEvyFpR3Dv88Jjkj42Df8xLyy4Errqqi2gMOAAU';
const VAPID_PUBLIC = 'BNtUxRU1oQ_pfnfos06sCxB-wXRAXzd0NuNIm26mv7NQWpAbE8KwBTsBmRQowb1lE-aPVUQ6GiYzVb_F__u30Do';
const LABELS = { hk: '香港', tech: '科技', esports: '電競', game: '遊戲', events: '活動', ent: '影視娛樂', prop: '樓市' };

const $ = (s) => document.querySelector(s);
const btn = $('#sub-btn'), notice = $('#notice'), list = $('#list'), wxEl = $('#wx');
let filter = 'all', digests = [];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const b64ToU8 = (b) => {
  const p = '='.repeat((4 - (b.length % 4)) % 4);
  const r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...r].map((c) => c.charCodeAt(0)));
};
const say = (t) => { notice.textContent = t; notice.classList.toggle('show', !!t); };

/* ---------- 天氣（沙田） ---------- */
const ICON_DESC = {
  50:'陽光充沛',51:'間有陽光',52:'短暫陽光',53:'間有陽光幾陣驟雨',54:'短暫陽光有驟雨',
  60:'多雲',61:'密雲',62:'微雨',63:'雨',64:'大雨',65:'雷暴',
  70:'天色良好',71:'天色良好',72:'天色良好',73:'天色良好',74:'天色良好',75:'天色良好',76:'大致多雲',77:'天色大致良好',
  80:'大風',81:'乾燥',82:'潮濕',83:'霧',84:'薄霧',85:'煙霞',
  90:'熱',91:'暖',92:'涼',93:'冷'
};
const AQHI_LABEL = { Low:'低', Moderate:'中等', High:'高', 'Very High':'甚高', Serious:'嚴重' };

function pickPlace(arr, names) {
  if (!arr) return null;
  for (const n of names) {
    const hit = arr.find((x) => x.place === n || x.place?.includes(n));
    if (hit) return hit;
  }
  return arr[0] || null;
}

async function loadWeather() {
  try {
    const [rhr, flw, aqhi, warn] = await Promise.all([
      fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc').then((r) => r.json()),
      fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc').then((r) => r.json()),
      fetch('https://dashboard.data.gov.hk/api/aqhi-individual?format=json').then((r) => r.json()).catch(() => []),
      fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc').then((r) => r.json()).catch(() => ({})),
    ]);

    const temp = pickPlace(rhr.temperature?.data, ['沙田']);
    const rain = pickPlace(rhr.rainfall?.data, ['沙田']);
    const humid = rhr.humidity?.data?.[0];
    const uv = rhr.uvindex?.data?.[0];
    const iconCode = Array.isArray(rhr.icon) ? rhr.icon[0] : rhr.icon;
    const iconUrl = iconCode ? `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png` : '';
    const desc = ICON_DESC[iconCode] || '';

    const aq = (Array.isArray(aqhi) ? aqhi : []).find((s) => s.station === 'Sha Tin' || s.station === '沙田');
    const aqVal = aq?.aqhi ?? '—';
    const aqRisk = AQHI_LABEL[aq?.health_risk] || aq?.health_risk || '';

    // 警告摘要
    const warnKeys = Object.keys(warn || {}).filter((k) => warn[k] && typeof warn[k] === 'object');
    const warnText = warnKeys.length
      ? warnKeys.map((k) => warn[k].name || warn[k].type || k).join('、')
      : (rhr.warningMessage || '');

    const forecast = flw.forecastDesc || '';
    const outlook = flw.outlook || '';
    const update = rhr.updateTime
      ? new Date(rhr.updateTime).toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong', hour: '2-digit', minute: '2-digit', hour12: false })
      : '';

    wxEl.innerHTML = `
      <div class="wx-head">
        ${iconUrl ? `<img class="wx-icon" src="${esc(iconUrl)}" alt="${esc(desc)}" width="48" height="48">` : ''}
        <div class="wx-main">
          <div class="wx-place">沙田 · 香港天文台</div>
          <div class="wx-temp">${temp ? temp.value + '°C' : '—'}</div>
          <div class="wx-desc">${esc(desc)}${update ? ' · 更新 ' + update : ''}</div>
        </div>
      </div>
      <div class="wx-grid">
        <div class="wx-cell"><div class="k">濕度</div><div class="v">${humid ? humid.value + '%' : '—'}</div></div>
        <div class="wx-cell"><div class="k">紫外線</div><div class="v">${uv ? uv.value + (uv.desc ? ' ' + uv.desc : '') : '—'}</div></div>
        <div class="wx-cell"><div class="k">降雨</div><div class="v">${rain && rain.max != null ? rain.max + ' mm' : '0 mm'}</div></div>
        <div class="wx-cell"><div class="k">AQHI</div><div class="v">${aqVal}${aqRisk ? ' ' + aqRisk : ''}</div></div>
      </div>
      ${warnText ? `<div class="wx-warn">⚠️ ${esc(warnText)}</div>` : ''}
      ${(forecast || outlook) ? `<div class="wx-forecast">${esc(forecast)}${outlook ? '<br>' + esc(outlook) : ''}</div>` : ''}
      <div class="wx-source">資料來源：香港天文台 Open Data · 環保署 AQHI</div>
    `;
  } catch (e) {
    wxEl.innerHTML = '<div class="wx-loading">天氣暫時未能載入</div>';
    console.error('weather', e);
  }
}

/* ---------- 新聞列表 ---------- */
function ago(ts) {
  if (!ts) return '';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 60) return Math.max(m, 1) + ' 分鐘前';
  if (m < 1440) return Math.round(m / 60) + ' 小時前';
  return new Date(ts).toLocaleDateString('zh-HK');
}
const articleCache = new Map(); // link -> text

async function fetchArticleText(url) {
  if (articleCache.has(url)) return articleCache.get(url);
  // 1) Jina Reader（最穩）
  try {
    const r = await fetch('https://r.jina.ai/' + url, {
      headers: { Accept: 'text/plain' },
      signal: AbortSignal.timeout(18000),
    });
    if (r.ok) {
      let t = await r.text();
      // 去掉 Jina 前置 metadata
      t = t.replace(/^Title:.*\n/m, '').replace(/^URL Source:.*\n/m, '')
           .replace(/^Published Time:.*\n/m, '').replace(/^Markdown Content:\n?/m, '')
           .replace(/^#{1,3} .+\n+/, '').trim();
      if (t.length > 120) {
        articleCache.set(url, t);
        return t;
      }
    }
  } catch (_) {}
  // 2) allorigins + 簡易抽取
  try {
    const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url), {
      signal: AbortSignal.timeout(15000),
    });
    if (!r.ok) throw new Error(String(r.status));
    const html = await r.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script,style,nav,header,footer,aside,iframe,noscript').forEach((n) => n.remove());
    const art = doc.querySelector('article') || doc.querySelector('[itemprop="articleBody"]') ||
                doc.querySelector('.article-content,.article-body,.story-body,.post-content,#article-body') ||
                doc.querySelector('main') || doc.body;
    let t = (art?.innerText || '').replace(/\n{3,}/g, '\n\n').trim();
    if (t.length > 200) {
      articleCache.set(url, t);
      return t;
    }
  } catch (_) {}
  return null;
}

function render() {
  if (!digests.length) { list.innerHTML = '<p class="empty">暫時未有新聞摘要。<br>下一個推送時間：9:00、15:00、21:00。</p>'; return; }
  list.innerHTML = digests.map((d) => {
    const t = new Date(d.created_at);
    const when = t.toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
    const cats = Object.keys(LABELS).filter((k) => (filter === 'all' || filter === k) && (d.items[k] || []).length)
      .map((k) => `<section class="cat" data-k="${k}"><h2>${LABELS[k]}</h2><ul>` +
        d.items[k].map((i) =>
          `<li data-link="${esc(i.link)}">` +
          `<a class="t" href="javascript:void(0)" role="button">${esc(i.title)}</a>` +
          `<small>${i.tag ? `<span class="tag">${esc(i.tag)}</span>` : ''}${esc(i.source || '')} ${ago(i.ts)}</small>` +
          `<div class="art-body"></div>` +
          `</li>`
        ).join('') +
        '</ul></section>').join('');
    return cats ? `<article class="digest"><h3 class="digest-title"><strong>${esc(d.slot)}</strong>${when}</h3>${cats}</article>` : '';
  }).join('') || '<p class="empty">這個分類暫時沒有新聞。</p>';

  list.querySelectorAll('li[data-link] > a.t').forEach((a) => {
    a.addEventListener('click', async (e) => {
      e.preventDefault();
      const li = a.closest('li');
      const link = li.dataset.link;
      const body = li.querySelector('.art-body');
      if (li.classList.contains('expanded')) {
        li.classList.remove('expanded');
        return;
      }
      // 收起其他
      list.querySelectorAll('li.expanded').forEach((x) => x.classList.remove('expanded'));
      li.classList.add('expanded');
      if (body.dataset.loaded === '1') return;
      body.className = 'art-body loading';
      body.textContent = '正在擷取全文…';
      const text = await fetchArticleText(link);
      body.className = 'art-body';
      if (text) {
        body.textContent = text.length > 6000 ? text.slice(0, 6000) + '…' : text;
        const oa = document.createElement('a');
        oa.className = 'orig';
        oa.href = link;
        oa.target = '_blank';
        oa.rel = 'noopener';
        oa.textContent = '閱讀原文 ↗';
        body.appendChild(document.createElement('br'));
        body.appendChild(oa);
        body.dataset.loaded = '1';
      } else {
        body.innerHTML = `<span class="err">暫時無法擷取全文（部分網站有保護）。</span><br>` +
          `<a class="orig" href="${esc(link)}" target="_blank" rel="noopener">開啟原文 ↗</a>`;
        body.dataset.loaded = '1';
      }
    });
  });
}
async function load() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/digests?select=slot,items,created_at&order=created_at.desc&limit=9`,
      { headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON } });
    if (!r.ok) throw new Error(r.status);
    digests = await r.json();
    render();
  } catch (e) {
    list.innerHTML = '<p class="empty">載入失敗，請檢查網絡後重新整理。</p>';
  }
}
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('nav button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  render();
}));

/* ---------- 推送訂閱 ---------- */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;

async function saveSub(sub) {
  const j = sub.toJSON();
  const r = await fetch(`${SUPABASE_URL}/rest/v1/subscriptions`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON,
      'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }),
  });
  if (r.status === 409) return;            // 已訂閱過，當作成功
  if (!r.ok) throw new Error('儲存失敗 ' + r.status + ' ' + (await r.text()).slice(0, 200));
}
function setBtn(on, label, disabled) {
  btn.dataset.on = on; btn.textContent = label; btn.disabled = !!disabled;
}
async function initPush() {
  btn.disabled = false;                       // 先確保掣可以撳，問題會在畫面上說明
  if (!('serviceWorker' in navigator)) { say('此瀏覽器不支援 Service Worker，無法使用推送。'); return; }
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  if (isIOS && !standalone) {
    say('iPhone／iPad：請先按 Safari 的「分享」→「加入主畫面」，再由主畫面開啟此 App，才可開啟推送。');
    setBtn(false, '開啟推送', false); return;
  }
  if (!('PushManager' in window)) { say('此環境不支援推送（iPhone 需 iOS 16.4 或以上，並由主畫面開啟）。'); setBtn(false, '開啟推送', false); return; }
  const sub = await reg.pushManager.getSubscription();
  if (sub && Notification.permission === 'granted') { saveSub(sub).catch(() => {}); setBtn(true, '推送已開啟', false); }
  else setBtn(false, '開啟推送', false);
  if (Notification.permission === 'denied') { say('通知已被封鎖，請到系統「設定」→「通知」允許此 App。'); }
}
btn.addEventListener('click', async () => {
  if (isIOS && !standalone) { say('請先「加入主畫面」，再由主畫面圖示開啟此 App，然後撳開啟推送。'); return; }
  if (!('PushManager' in window)) { say('此環境不支援推送。'); return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (btn.dataset.on === 'true') {            // 關閉推送
    if (sub) await sub.unsubscribe();
    setBtn(false, '開啟推送', false); say('已關閉推送。'); return;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { say('未允許通知，無法開啟推送。'); return; }
    const s = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC) });
    await saveSub(s);
    setBtn(true, '推送已開啟', false); say('已開啟！每日 9:00、15:00、21:00 會收到新聞摘要。');
  } catch (e) { say('開啟失敗：' + e.message); }
});

navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', (e) => e.data.type === 'refresh' && load());
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { load(); loadWeather(); }
});
load();
loadWeather();
initPush().catch((e) => say('初始化失敗：' + e.message));
// 每 15 分鐘自動刷新天氣
setInterval(loadWeather, 15 * 60 * 1000);
</script>
</body>
</html>
